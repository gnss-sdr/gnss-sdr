name: Build volk_gnsssdr on Android NDK

on:
  push:
    paths:
      - "src/algorithms/libs/volk_gnsssdr_module/volk_gnsssdr/**"
      - "CMakeLists.txt"
  pull_request:
    paths:
      - "src/algorithms/libs/volk_gnsssdr_module/volk_gnsssdr/**"
      - "CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk-linux
  ANDROID_CMDLINE_TOOLS_VERSION: "15859902"
  ANDROID_NDK_VERSION: "27.3.13750724"
  ANDROID_API_LEVEL: "34"

jobs:
  build:
    name: Build on Android NDK ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        arch:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-mako

      # Setup Java
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Setup Android command-line tools
      - name: Install Android command-line tools
        run: |
          archive="$RUNNER_TEMP/android-commandlinetools.zip"
          extract_dir="$RUNNER_TEMP/android-commandlinetools"

          wget --quiet \
            --output-document="$archive" \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS_VERSION}_latest.zip"

          mkdir -p "$extract_dir"
          unzip -qq "$archive" -d "$extract_dir"

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv "$extract_dir/cmdline-tools/"* \
            "$ANDROID_HOME/cmdline-tools/latest/"

      # Install the Android NDK using the new Android CLI
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/android" \
            --sdk="$ANDROID_HOME" \
            sdk install "ndk/${ANDROID_NDK_VERSION}"

          test -f \
            "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake"

      # Configure
      - name: Configure ${{ matrix.arch }}
        run: |
          cmake \
            -S "$GITHUB_WORKSPACE/src/algorithms/libs/volk_gnsssdr_module/volk_gnsssdr" \
            -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.arch }}" \
            -DANDROID_PLATFORM="android-${ANDROID_API_LEVEL}" \
            -DCMAKE_BUILD_TYPE=Release

      # Build
      - name: Build ${{ matrix.arch }}
        run: |
          cmake --build "$GITHUB_WORKSPACE/build" --parallel