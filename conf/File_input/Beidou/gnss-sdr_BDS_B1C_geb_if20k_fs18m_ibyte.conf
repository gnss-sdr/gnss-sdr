; BeiDou B1C (1D) file-input example (IF = +20 kHz, Fs = 18 MHz, ibyte)
; Test data: https://drive.google.com/drive/folders/1UkjJwOMlKEFZiXYUdK4HKzTASYHXMsHL
; SPDX-License-Identifier: GPL-3.0-or-later
; SPDX-FileCopyrightText: (C) 2010-2026  (see AUTHORS file for a list of contributors)
;
; Mixed B1I+B1C PVT policy (same PRN):
;   - RTKLIB bands: B1I=0 (FREQ1_BDS), B1C/1D=1 (FREQ1), B3I=2 (FREQ3_BDS).
;   - When both B1I and B1C are tracked for the same PRN and usable B-CNAV1
;     exists, PVT prefers B1C+CNAV1 and does not insert that PRN's B1I into
;     the RTKLIB observation epoch (avoids dual DNAV/CNAV1 rows for one sat).
;   - If B1C lacks usable CNAV1, B1I+DNAV is kept. RINEX/obs dumps still keep
;     both signals; the preference applies only to the PVT engine.
;   - Iono-Free-LC for BeiDou uses B1I+B3I only; B1C is single-frequency.
;   - Dual-frequency IF: set PVT.iono_model=Iono-Free-LC with Channels_B1+B3.

[GNSS-SDR]

;######### GLOBAL OPTIONS ##################
GNSS-SDR.internal_fs_sps=18000000
GNSS-SDR.use_acquisition_resampler=true

ControlThread.wait_for_flowgraph=false

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=File_Signal_Source
SignalSource.filename=./L1_IF20KHz_FS18MHz.bin
SignalSource.item_type=ibyte
SignalSource.sampling_frequency=18000000
SignalSource.samples=0
SignalSource.enable_throttle_control=false

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Ibyte_To_Complex
DataTypeAdapter.item_type=ibyte

;######### INPUT_FILTER CONFIG ############
InputFilter.implementation=Freq_Xlating_Fir_Filter
InputFilter.input_item_type=gr_complex
InputFilter.output_item_type=gr_complex
InputFilter.taps_item_type=float
InputFilter.number_of_taps=5
InputFilter.number_of_bands=2
InputFilter.band1_begin=0.0
InputFilter.band1_end=0.45
InputFilter.band2_begin=0.55
InputFilter.band2_end=1.0
InputFilter.ampl1_begin=1.0
InputFilter.ampl1_end=1.0
InputFilter.ampl2_begin=0.0
InputFilter.ampl2_end=0.0
InputFilter.band1_error=1.0
InputFilter.band2_error=1.0
InputFilter.filter_type=bandpass
InputFilter.grid_density=16
InputFilter.sampling_frequency=18000000
InputFilter.IF=20000

Resampler.implementation=Pass_Through

;######### CHANNELS GLOBAL CONFIG ############
Channels_1D.count=6
Channels.in_acquisition=6

Channel.signal=1D

Channel0.satellite=23
Channel1.satellite=27
Channel2.satellite=28
Channel3.satellite=37
Channel4.satellite=43
Channel5.satellite=46

;######### ACQUISITION GLOBAL CONFIG ############
Acquisition_1D.implementation=BEIDOU_B1C_PCPS_Ambiguous_Acquisition
Acquisition_1D.item_type=gr_complex
Acquisition_1D.acquire_pilot=true
Acquisition_1D.qmboc=true
Acquisition_1D.pfa=0.005
Acquisition_1D.doppler_max=5000
Acquisition_1D.doppler_step=25

;######### TRACKING GLOBAL CONFIG ############
Tracking_1D.implementation=BEIDOU_B1C_DLL_PLL_VEML_Tracking
Tracking_1D.item_type=gr_complex
Tracking_1D.track_pilot=true
Tracking_1D.extend_correlation_symbols=4
Tracking_1D.bit_synchronization_time_limit_s=90
Tracking_1D.pull_in_time_s=5
Tracking_1D.pll_bw_hz=10.0
Tracking_1D.dll_bw_hz=0.5
Tracking_1D.pll_bw_narrow_hz=5.0
Tracking_1D.dll_bw_narrow_hz=0.2
Tracking_1D.pll_filter_order=2
Tracking_1D.early_late_space_chips=0.15
Tracking_1D.very_early_late_space_chips=0.5
Tracking_1D.cn0_min=20
Tracking_1D.b1c_secondary_lock_ratio=0.92

;######### TELEMETRY DECODER CONFIG ############
TelemetryDecoder_1D.implementation=BEIDOU_B1C_Telemetry_Decoder
TelemetryDecoder_1D.dump=false

;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables

;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.output_rate_ms=100
PVT.display_rate_ms=500
; Broadcast: B1C uses BDGIM when B-CNAV1 page-1 iono is decoded; else GPS Klobuchar.
; For B1I+B3I iono-free LC use Iono-Free-LC (not applicable to B1C-only).
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.flag_rtcm_server=false

PVT.output_enabled=true
PVT.rinex_output_enabled=true
PVT.nmea_output_file_enabled=true
PVT.gpx_output_enabled=true
