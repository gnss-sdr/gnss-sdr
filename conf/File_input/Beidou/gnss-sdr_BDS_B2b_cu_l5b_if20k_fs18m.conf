; BeiDou B2b (B2) on CU-SDR-Collection L5b/E5b recording.
; Source: https://drive.google.com/drive/folders/1UkjJwOMlKEFZiXYUdK4HKzTASYHXMsHL
; File: L5b_IF20KHz_FS18MHz.bin  (README lists Galileo E5b; B2b shares 1207.14 MHz)
; 8-bit interleaved I/Q (MATLAB fileType=2), Fs=18e6, IF=+20e3.
; SPDX-License-Identifier: GPL-3.0-or-later

[GNSS-SDR]
GNSS-SDR.internal_fs_sps=18000000
GNSS-SDR.use_acquisition_resampler=true

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=File_Signal_Source
SignalSource.filename=./L5b_IF20KHz_FS18MHz.bin  ; <- PUT YOUR FILE HERE
SignalSource.item_type=ibyte
SignalSource.sampling_frequency=18000000
SignalSource.samples=0
SignalSource.repeat=false
SignalSource.dump=false
SignalSource.enable_throttle_control=false

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Ibyte_To_Complex
DataTypeAdapter.item_type=ibyte
InputFilter.implementation=Freq_Xlating_Fir_Filter
InputFilter.input_item_type=gr_complex
InputFilter.output_item_type=gr_complex
InputFilter.taps_item_type=float
InputFilter.number_of_taps=5
InputFilter.number_of_bands=2
InputFilter.band1_begin=0.0
InputFilter.band1_end=0.45
InputFilter.band2_begin=0.55
InputFilter.band2_end=1.0
InputFilter.ampl1_begin=1.0
InputFilter.ampl1_end=1.0
InputFilter.ampl2_begin=0.0
InputFilter.ampl2_end=0.0
InputFilter.band1_error=1.0
InputFilter.band2_error=1.0
InputFilter.filter_type=bandpass
InputFilter.grid_density=16
InputFilter.sampling_frequency=18000000
InputFilter.IF=20000
Resampler.implementation=Pass_Through

;######### CHANNELS ############
; Same BDS-3 MEO list that locked on the sibling L5/B2a file.
Channels_B2.count=16
Channels.in_acquisition=2
Channel.signal=B2

Channel0.satellite=19
Channel1.satellite=21
Channel2.satellite=22
Channel3.satellite=24
Channel4.satellite=26
Channel5.satellite=27
Channel6.satellite=28
Channel7.satellite=32
Channel8.satellite=33
Channel9.satellite=36
Channel10.satellite=37
Channel11.satellite=39
Channel12.satellite=42
Channel13.satellite=43
Channel14.satellite=45
Channel15.satellite=46

;######### ACQUISITION ############
Acquisition_B2.implementation=BEIDOU_B2B_PCPS_Acquisition
Acquisition_B2.item_type=gr_complex
Acquisition_B2.coherent_integration_time_ms=1
Acquisition_B2.pfa=0.01
Acquisition_B2.doppler_max=5000
Acquisition_B2.doppler_step=250
Acquisition_B2.max_dwells=8
Acquisition_B2.dump=false

;######### TRACKING ############
Tracking_B2.implementation=BEIDOU_B2B_DLL_PLL_Tracking
Tracking_B2.item_type=gr_complex
Tracking_B2.pll_bw_hz=15.0
Tracking_B2.dll_bw_hz=2.0
Tracking_B2.pll_bw_narrow_hz=8.0
Tracking_B2.dll_bw_narrow_hz=1.5
Tracking_B2.pull_in_time_s=1
Tracking_B2.dump=false

;######### TELEMETRY ############
TelemetryDecoder_B2.implementation=BEIDOU_B2B_Telemetry_Decoder
TelemetryDecoder_B2.dump=false

Observables.implementation=Hybrid_Observables
Observables.dump=false

PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.output_rate_ms=200
PVT.display_rate_ms=200
PVT.flag_rtklib_pvt=true
PVT.iono_model=OFF
PVT.trop_model=OFF
PVT.elevation_mask=5
PVT.output_enabled=true
PVT.nmea_output_file_enabled=true
PVT.kml_output_enabled=true
PVT.geojson_output_enabled=true
PVT.rinex_output_enabled=true
PVT.output_path=./pvt
PVT.nmea_dump_filename=nmea_pvt.nmea
