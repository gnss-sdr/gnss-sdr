; GNSS-SDR config for the synthetic 20 MHz B2b IQ (BPSK(10), IF=0, float32 IQ).
; Synthetic nav bits are all +1: acquisition/tracking only, no B-CNAV3/PVT.
; File_Signal_Source truncates a 0.1 s tail; keep the IQ longer than that.
; SPDX-License-Identifier: GPL-3.0-or-later
; SPDX-FileCopyrightText: (C) 2026 Chandoss <huangchh37@mail2.sysu.edu.cn>

[GNSS-SDR]
GNSS-SDR.internal_fs_sps=20000000

ControlThread.wait_for_flowgraph=false

SignalSource.implementation=File_Signal_Source
; Point this at B2b_synth_20M_300ms.bin (acq/track only; nav bits are all +1).
SignalSource.filename=./data/B2b_synth_20M_300ms.bin  ; <- PUT YOUR FILE HERE
SignalSource.item_type=gr_complex
SignalSource.sampling_frequency=20000000
SignalSource.samples=0
SignalSource.repeat=false
SignalSource.dump=false
SignalSource.enable_throttle_control=false

SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Pass_Through
DataTypeAdapter.item_type=gr_complex
InputFilter.implementation=Pass_Through
InputFilter.item_type=gr_complex
Resampler.implementation=Pass_Through
Resampler.item_type=gr_complex
Resampler.sample_freq_in=20000000
Resampler.sample_freq_out=20000000

Channels_B2.count=4
Channels.in_acquisition=1
Channel.signal=B2
Channel0.satellite=19
Channel1.satellite=21
Channel2.satellite=25
Channel3.satellite=32

Acquisition_B2.implementation=BEIDOU_B2B_PCPS_Acquisition
Acquisition_B2.item_type=gr_complex
Acquisition_B2.coherent_integration_time_ms=1
Acquisition_B2.pfa=0.01
Acquisition_B2.doppler_max=5000
Acquisition_B2.doppler_step=250
Acquisition_B2.max_dwells=8
Acquisition_B2.dump=true
Acquisition_B2.dump_filename=./bds_b2b_acq

Tracking_B2.implementation=BEIDOU_B2B_DLL_PLL_Tracking
Tracking_B2.item_type=gr_complex
Tracking_B2.pll_bw_hz=15.0
Tracking_B2.dll_bw_hz=2.0
Tracking_B2.dump=false

TelemetryDecoder_B2.implementation=BEIDOU_B2B_Telemetry_Decoder
TelemetryDecoder_B2.dump=false

Observables.implementation=Hybrid_Observables
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.output_rate_ms=500
PVT.display_rate_ms=500
PVT.flag_rtklib_pvt=true
