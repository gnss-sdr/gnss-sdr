; GPS L1C (1S) from the FGI "Raw GPS L1C I/Q-data for FGI-GSRx" dataset
; (https://doi.org/10.23729/81073294-7c15-4bf5-b592-deb8dc618d7c, CC BY 4.0).
; Safran Skydel simulation: GPS L1C, GPS L1 C/A, Galileo E1 OS and BDS B1C,
; AWGN only, no ionosphere, troposphere, orbit or clock errors.
; Start 2023-09-28 23:20:00 UTC, 119 s, static receiver at
; 60.182260 deg, 24.828537 deg, 47.248 m.
; File: centre 1575.42 MHz, 25 Msps, interleaved 8+8 bit signed I/Q (I first).
;
; Pääkkönen, I., & Bhuiyan, Z. (2024). Raw GPS L1C I/Q-data for FGI-GSRx (Version 1).
; National Land Survey of Finland, FGI Dept. of Navigation and positioning.
;
; The 25 Msps band resolves the BOC(6,1) part of the L1CP TMBOC, so tracking
; uses the TMBOC replica. Acquisition runs on a BOC(1,1) replica at 4 Msps.
; With the TMBOC replica, a narrow early-late spacing of 0.15 chips makes the
; VEML discriminator unstable at zero delay, and the DLL locks at +/-6 m
; (1/48 chip). The 0.2 and 0.07 chip spacings below keep a unique lock at
; zero delay.
;
; SPDX-License-Identifier: GPL-3.0-or-later
; SPDX-FileCopyrightText: (C) 2026 Carles Fernandez-Prades <carles.fernandez@cttc.es>

[GNSS-SDR]

;######### GLOBAL OPTIONS ##################
GNSS-SDR.internal_fs_sps=25000000
GNSS-SDR.use_acquisition_resampler=true
GNSS-SDR.deterministic=true

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=File_Signal_Source
SignalSource.filename=../data/skydelL1band_290923.iq  ; <- PUT YOUR FILE HERE
SignalSource.item_type=ibyte
SignalSource.sampling_frequency=25000000
SignalSource.samples=0

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Ibyte_To_Complex
InputFilter.implementation=Pass_Through
InputFilter.item_type=gr_complex
Resampler.implementation=Pass_Through
Resampler.item_type=gr_complex

;######### CHANNELS GLOBAL CONFIG ############
Channels_1S.count=12
Channels.in_acquisition=1

;######### ACQUISITION GLOBAL CONFIG ############
Acquisition_1S.implementation=GPS_L1C_PCPS_Ambiguous_Acquisition
Acquisition_1S.item_type=gr_complex
Acquisition_1S.acquire_pilot=true
Acquisition_1S.tmboc=false
Acquisition_1S.pfa=0.001
Acquisition_1S.doppler_max=6000
Acquisition_1S.doppler_step=50
Acquisition_1S.blocking=true

;######### TRACKING GLOBAL CONFIG ############
Tracking_1S.implementation=GPS_L1C_DLL_PLL_VEML_Tracking
Tracking_1S.item_type=gr_complex
Tracking_1S.track_pilot=true
Tracking_1S.tmboc=true
Tracking_1S.pll_bw_hz=15.0
Tracking_1S.dll_bw_hz=0.75
Tracking_1S.pll_bw_narrow_hz=5.0
Tracking_1S.dll_bw_narrow_hz=0.2
Tracking_1S.early_late_space_chips=0.2
Tracking_1S.early_late_space_narrow_chips=0.07
Tracking_1S.very_early_late_space_chips=0.5
Tracking_1S.very_early_late_space_narrow_chips=0.5
Tracking_1S.extend_correlation_symbols=2

;######### TELEMETRY DECODER CONFIG ############
TelemetryDecoder_1S.implementation=GPS_L1C_Telemetry_Decoder

;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables

;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.iono_model=OFF  ; the scenario simulates no ionosphere
PVT.trop_model=OFF  ; the scenario simulates no troposphere
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.elevation_mask=5
PVT.rinex_output_enabled=true
PVT.dump=true
PVT.dump_filename=./PVT
