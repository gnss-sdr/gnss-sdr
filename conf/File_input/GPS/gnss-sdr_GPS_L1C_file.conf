; SPDX-FileCopyrightText: (C) 2026 Carles Fernandez-Prades <carles.fernandez@cttc.es>

[GNSS-SDR]

;######### GLOBAL OPTIONS ##################
GNSS-SDR.internal_fs_sps=4000000
GNSS-SDR.deterministic=true

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=File_Signal_Source
SignalSource.filename=../data/gps_l1c_capture.dat  ; <- PUT YOUR FILE HERE
SignalSource.item_type=gr_complex
SignalSource.sampling_frequency=4000000
SignalSource.samples=0

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Pass_Through

;######### CHANNELS GLOBAL CONFIG ############
Channels_1S.count=8
Channels.in_acquisition=1

;######### ACQUISITION GLOBAL CONFIG ############
Acquisition_1S.implementation=GPS_L1C_PCPS_Ambiguous_Acquisition
Acquisition_1S.item_type=gr_complex
Acquisition_1S.acquire_pilot=true
Acquisition_1S.tmboc=false
Acquisition_1S.pfa=0.001
Acquisition_1S.doppler_max=5000
Acquisition_1S.doppler_step=50
Acquisition_1S.blocking=true

;######### TRACKING GLOBAL CONFIG ############
Tracking_1S.implementation=GPS_L1C_DLL_PLL_VEML_Tracking
Tracking_1S.item_type=gr_complex
Tracking_1S.track_pilot=true
Tracking_1S.pll_bw_hz=15.0
Tracking_1S.dll_bw_hz=0.75
Tracking_1S.pll_bw_narrow_hz=5.0
Tracking_1S.dll_bw_narrow_hz=0.2
Tracking_1S.early_late_space_chips=0.25
Tracking_1S.early_late_space_narrow_chips=0.15
Tracking_1S.very_early_late_space_chips=0.5
Tracking_1S.very_early_late_space_narrow_chips=0.5
Tracking_1S.extend_correlation_symbols=2

;######### TELEMETRY DECODER CONFIG ############
TelemetryDecoder_1S.implementation=GPS_L1C_Telemetry_Decoder

;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables

;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.rinex_output_enabled=true
