; GPS L1C (1S) file-input example: complex baseband samples (gr_complex).
; The receiver tracks the L1CP pilot (TMBOC, here with a BOC(1,1) replica) and
; synchronizes its 1800-chip overlay code, which takes 18 s. The telemetry
; decoder then finds the CNAV-2 frame (BCH TOI, LDPC subframes 2 and 3,
; CRC-24Q) in the L1CD symbols, so the first ephemeris arrives about 40 s
; after tracking starts. Only GPS III and later satellites broadcast L1C.
;
; Front-end bandwidth: at least 4 MHz around L1 for the BOC(1,1) main lobes.
; Set Acquisition_1S.tmboc=true and Tracking_1S.tmboc=true only with
; sampling rates and bandwidths that resolve the BOC(6,1) component
; (more than about 14 MHz). With the TMBOC replica, some early-late spacings
; (e.g., the 0.15 chips used below) lock the DLL about 6 m off zero delay;
; Tracking_1S.early_late_space_chips=0.2 and
; Tracking_1S.early_late_space_narrow_chips=0.07 do not, and the receiver
; switches to them (with a log warning) when the configured ones would.
;
; PVT policy: when a satellite is tracked on both L1 C/A (1C) and L1C (1S),
; the L1 C/A observable and the LNAV ephemeris are used for positioning.
;
