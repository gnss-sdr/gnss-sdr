; Reference configuration for the SAPHYRION EVK1029 dual-band RF front-end
; (EVK1029_Signal_Source, see #1091 and #1114), tracking Galileo E1+E5a and
; GPS L1+L5 from one dual-IF raw capture. Every key below is implemented in
; gnss-sdr's `next` branch as of this PR -- nothing here depends on any
; other pending/unmerged feature.
;
; Edit SignalSource0.filename and, if you use AGNSS aiding, the
; GNSS-SDR.AGNSS_* paths below to point at your own capture/aiding files
; before running.

[GNSS-SDR]

;| Constellation / signal | Carrier frequency | Assumed max |v_LOS| | Approx. max satellite Doppler |
;|-------------------------|--------------|-----------|------------|
;| GPS L1                  | 1575.42 MHz  | 0.93 km/s | ±4.89 kHz  |
;| GPS L5                  | 1176.45 MHz  | 0.93 km/s | ±3.65 kHz  |
;| Galileo E1               | 1575.42 MHz  | 0.80 km/s | ±4.20 kHz  |
;| Galileo E5a              | 1176.45 MHz  | 0.80 km/s | ±3.14 kHz  |

;######### GLOBAL OPTIONS ##################
GNSS-SDR.num_sources               = 1
GNSS-SDR.internal_fs_sps           = 17750000  ; internal working rate after decimation
GNSS-SDR.observable_interval_ms    = 1000
GNSS-SDR.assist_dual_frequency_acq = true
GNSS-SDR.osnma_enable              = false

; Runtime satellite-visibility-aware acquisition search: reorders the
; acquisition search queue to favor satellites confidently above the
; horizon once a fix or the AGNSS reference location above is available,
; instead of a plain FIFO order.
GNSS-SDR.enable_visibility_aware_search            = true
GNSS-SDR.visible_vs_mayvisible_search_ratio        = 10
GNSS-SDR.visibility_recompute_interval_s           = 120.0
GNSS-SDR.visibility_recompute_position_threshold_m = 1000.0
GNSS-SDR.visibility_almanac_max_age_s              = 259200.0
GNSS-SDR.search_elevation_mask                     = 15

; AGNSS aiding (optional): speeds up the first fix by supplying an
; approximate reference location/time plus previously-downloaded
; ephemeris/almanac/iono/UTC XML files, instead of waiting for the
; receiver to decode everything from the live signal.
GNSS-SDR.AGNSS_XML_enabled       = true
GNSS-SDR.AGNSS_ref_location      = 46.012965,8.907565  ; approximate receiver location, lat,lon in degrees
GNSS-SDR.AGNSS_ref_utc_time      = 01/01/2026 00:00:00.000000  ; approximate capture start time, UTC
;GNSS-SDR.AGNSS_gal_ephemeris_xml = /path/to/your/gal_ephemeris.xml
GNSS-SDR.AGNSS_gal_almanac_xml   = /path/to/your/gal_almanac.xml
GNSS-SDR.AGNSS_gal_iono_xml      = /path/to/your/gal_iono.xml
GNSS-SDR.AGNSS_gal_utc_model_xml = /path/to/your/gal_utc_model.xml
;GNSS-SDR.AGNSS_gps_ephemeris_xml = /path/to/your/gps_ephemeris.xml
GNSS-SDR.AGNSS_gps_almanac_xml   = /path/to/your/gps_almanac.xml
GNSS-SDR.AGNSS_gps_iono_xml      = /path/to/your/gps_iono.xml
GNSS-SDR.AGNSS_gps_utc_model_xml = /path/to/your/gps_utc_model.xml

;######### SIGNAL_SOURCE CONFIG ############
SignalSource0.implementation     = EVK1029_Signal_Source
SignalSource0.filename           = /path/to/your/EVK1029_capture.rec
SignalSource0.sampling_frequency = 177500000
SignalSource0.RF_channels        = 2  ; one IF conditioner per band below
; Jump straight to a time of interest (seconds) in a long capture instead
; of always reprocessing from the start (see #1114):
;SignalSource0.seconds_to_skip   = 3600
;SignalSource0.dump              = true
;SignalSource0.dump_filename     = ./evk1029_signal_source.dat

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner0.implementation = Signal_Conditioner
SignalConditioner1.implementation = Signal_Conditioner

;######### DATA_TYPE_ADAPTER CONFIG ############
DataTypeAdapter0.implementation = Pass_Through
DataTypeAdapter0.item_type      = byte
DataTypeAdapter1.implementation = Pass_Through
DataTypeAdapter1.item_type      = byte

;######### INPUT_FILTER CONFIG ############
; RF CHANNEL 0 -> extracts the Galileo E1 / GPS L1 band at IF0
InputFilter0.implementation     = Freq_Xlating_Fir_Filter
InputFilter0.input_item_type    = byte
InputFilter0.output_item_type   = gr_complex
InputFilter0.taps_item_type     = float
InputFilter0.sampling_frequency = 177500000
InputFilter0.IF                 = -22080000
InputFilter0.filter_type        = lowpass
InputFilter0.bw                 = 10000000
InputFilter0.tw                 = 5000000
InputFilter0.decimation_factor  = 10
;InputFilter0.dump              = true
;InputFilter0.dump_filename     = ./evk1029_band0_Xlated.dat

; RF CHANNEL 1 -> extracts the Galileo E5a / GPS L5 band at IF1
InputFilter1.implementation     = Freq_Xlating_Fir_Filter
InputFilter1.input_item_type    = byte
InputFilter1.output_item_type   = gr_complex
InputFilter1.taps_item_type     = float
InputFilter1.sampling_frequency = 177500000
InputFilter1.IF                 = -66050000
InputFilter1.filter_type        = lowpass
InputFilter1.bw                 = 10000000
InputFilter1.tw                 = 5000000
InputFilter1.decimation_factor  = 10
;InputFilter1.dump              = true
;InputFilter1.dump_filename     = ./evk1029_band1_Xlated.dat

;######### RESAMPLER CONFIG ############
Resampler0.implementation = Pass_Through
Resampler1.implementation = Pass_Through

;######### CHANNELS GLOBAL CONFIG ############
Channels.in_acquisition = 10

Channels_1B.count = 10  ; Galileo E1
Channels_5X.count = 10  ; Galileo E5a
Channels_1C.count = 10  ; GPS L1
Channels_L5.count = 10  ; GPS L5

Channels_1B.RF_channel_ID = 0
Channels_1C.RF_channel_ID = 0
Channels_5X.RF_channel_ID = 1
Channels_L5.RF_channel_ID = 1

;######### ACQUISITION GLOBAL CONFIG ############
; Galileo E1-C pilot: primary code 4092 chips/1.023 Mcps = 4 ms; secondary
; code (25 chips): 25x4ms = 100 ms. Doppler step of 1/2T keeps correlation
; loss due to frequency error below ~4 dB.
Acquisition_1B.implementation                    = Galileo_E1_PCPS_Ambiguous_Acquisition
Acquisition_1B.full_grid_search                  = true
Acquisition_1B.enable_doppler_narrowing          = true
Acquisition_1B.acquire_pilot                     = true
Acquisition_1B.item_type                         = gr_complex
Acquisition_1B.coherent_integration_time_ms      = 4
Acquisition_1B.doppler_max                       = 5000
Acquisition_1B.doppler_step                      = 125
Acquisition_1B.max_dwells                        = 5
Acquisition_1B.pfa                               = 1e-7
Acquisition_1B.cboc                              = true
;Acquisition_1B.dump                             = true
;Acquisition_1B.dump_filename                    = ./acq_galileoE1.dat

; Galileo E5a-I data channel: primary code 10230 chips/10.23 Mcps = 1 ms;
; secondary code (20 chips): 20x20ms = 400 ms.
Acquisition_5X.implementation               = Galileo_E5a_Pcps_Acquisition
Acquisition_5X.enable_doppler_narrowing     = true
Acquisition_5X.item_type                    = gr_complex
Acquisition_5X.coherent_integration_time_ms = 1
Acquisition_5X.doppler_max                  = 3740
Acquisition_5X.doppler_step                 = 500
Acquisition_5X.max_dwells                   = 20
Acquisition_5X.pfa                          = 1e-7
;Acquisition_5X.dump                        = true
;Acquisition_5X.dump_filename               = ./acq_galileoE5a.dat

Acquisition_1C.implementation               = GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.full_grid_search             = true
Acquisition_1C.enable_doppler_narrowing     = true
Acquisition_1C.item_type                    = gr_complex
Acquisition_1C.coherent_integration_time_ms = 1
Acquisition_1C.doppler_max                  = 5000
Acquisition_1C.doppler_step                 = 500
Acquisition_1C.max_dwells                   = 20
Acquisition_1C.pfa                          = 1e-7
;Acquisition_1C.dump                        = true
;Acquisition_1C.dump_filename               = ./acq_gpsL1.dat

Acquisition_L5.implementation               = GPS_L5i_PCPS_Acquisition
Acquisition_L5.enable_doppler_narrowing     = true
Acquisition_L5.acquire_pilot                = true
Acquisition_L5.item_type                    = gr_complex
Acquisition_L5.coherent_integration_time_ms = 1
Acquisition_L5.doppler_max                  = 3740
Acquisition_L5.doppler_step                 = 500
Acquisition_L5.max_dwells                   = 20
Acquisition_L5.pfa                          = 1e-7
;Acquisition_L5.dump                        = true
;Acquisition_L5.dump_filename               = ./acq_gpsL5.dat

;######### TRACKING GLOBAL CONFIG ############
; FLL frequency discriminator: a wrapped-ATAN delta-phase discriminator
; with integration time T has a capture range of 1/4T. FLL tracking
; threshold: 3*sigma_FLL <= 1/4T; PLL tracking threshold: 3*sigma_PLL <=
; 20 deg. Acquisition_*.enable_doppler_narrowing above is what keeps the
; frequency error handed off to tracking within what these loops can pull
; in.
Tracking_1B.implementation                     = Galileo_E1_DLL_PLL_VEML_Tracking
Tracking_1B.item_type                          = gr_complex
Tracking_1B.carrier_aiding                     = true
Tracking_1B.fll_bw_hz                          = 10.0
Tracking_1B.pll_bw_hz                          = 10.0
Tracking_1B.dll_bw_hz                          = 2.0
Tracking_1B.pll_bw_narrow_hz                   = 5.0
Tracking_1B.dll_bw_narrow_hz                   = 0.5
Tracking_1B.enable_fll_pull_in                 = true
Tracking_1B.enable_fll_steady_state            = false
Tracking_1B.track_pilot                        = true
Tracking_1B.early_late_space_chips             = 0.15
Tracking_1B.very_early_late_space_chips        = 0.6
Tracking_1B.very_early_late_space_narrow_chips = 0.30
Tracking_1B.extend_correlation_symbols         = 5
Tracking_1B.f_error_step_num                   = 9
Tracking_1B.f_error_accumulation               = 5
Tracking_1B.f_error_doppler_step               = 31
;Tracking_1B.dump                              = true
;Tracking_1B.dump_filename                     = trk_galileoE1_ch

Tracking_5X.implementation             = Galileo_E5a_DLL_PLL_Tracking
Tracking_5X.item_type                  = gr_complex
Tracking_5X.carrier_aiding             = true
Tracking_5X.fll_bw_hz                  = 10.0
Tracking_5X.pll_bw_hz                  = 10.0
Tracking_5X.dll_bw_hz                  = 2.0
Tracking_5X.pll_bw_narrow_hz           = 5.0
Tracking_5X.dll_bw_narrow_hz           = 0.5
Tracking_5X.enable_fll_pull_in         = true
Tracking_5X.enable_fll_steady_state    = false
Tracking_5X.extend_correlation_symbols = 20
Tracking_5X.track_pilot                = true
Tracking_5X.early_late_space_chips     = 0.2
; not needed with Acquisition_5X.enable_doppler_narrowing = true:
;Tracking_5X.f_error_step_num          = 5
;Tracking_5X.f_error_accumulation      = 20
;Tracking_5X.f_error_doppler_step      = 250
;Tracking_5X.dump                      = true
;Tracking_5X.dump_filename             = trk_galileoE5a_ch

Tracking_1C.implementation             = GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type                  = gr_complex
Tracking_1C.carrier_aiding             = true
Tracking_1C.fll_bw_hz                  = 10.0
Tracking_1C.pll_bw_hz                  = 10.0
Tracking_1C.dll_bw_hz                  = 2.0
Tracking_1C.pll_bw_narrow_hz           = 5.0
Tracking_1C.dll_bw_narrow_hz           = 0.5
Tracking_1C.enable_fll_pull_in         = true
Tracking_1C.enable_fll_steady_state    = false
Tracking_1C.extend_correlation_symbols = 20
; not needed with Acquisition_1C.enable_doppler_narrowing = true:
;Tracking_1C.f_error_step_num          = 5
;Tracking_1C.f_error_accumulation      = 20
;Tracking_1C.f_error_doppler_step      = 250
;Tracking_1C.dump                      = true
;Tracking_1C.dump_filename             = trk_gpsL1_ch

Tracking_L5.implementation             = GPS_L5_DLL_PLL_Tracking
Tracking_L5.item_type                  = gr_complex
Tracking_L5.carrier_aiding             = true
Tracking_L5.fll_bw_hz                  = 10.0
Tracking_L5.pll_bw_hz                  = 10.0
Tracking_L5.dll_bw_hz                  = 2.0
Tracking_L5.pll_bw_narrow_hz           = 5.0
Tracking_L5.dll_bw_narrow_hz           = 0.5
Tracking_L5.enable_fll_pull_in         = true
Tracking_L5.enable_fll_steady_state    = false
Tracking_L5.extend_correlation_symbols = 20
Tracking_L5.track_pilot                = true
Tracking_L5.early_late_space_chips     = 0.5
; not needed with Acquisition_L5.enable_doppler_narrowing = true:
;Tracking_L5.f_error_step_num          = 9
;Tracking_L5.f_error_accumulation      = 20
;Tracking_L5.f_error_doppler_step      = 250
;Tracking_L5.dump                      = true
;Tracking_L5.dump_filename             = trk_gpsL5_ch

;######### TELEMETRY DECODER CONFIG ############
TelemetryDecoder_1B.implementation = Galileo_E1B_Telemetry_Decoder
TelemetryDecoder_1C.implementation = GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_5X.implementation = Galileo_E5a_Telemetry_Decoder
TelemetryDecoder_L5.implementation = GPS_L5_Telemetry_Decoder

;######### OBSERVABLES CONFIG ############
Observables.implementation = Hybrid_Observables
;Observables.dump          = true

;######### PVT CONFIG ############
PVT.implementation             = RTKLIB_PVT
PVT.elevation_mask             = 10
PVT.num_bands                  = 2
PVT.dynamics_model              = 0
PVT.raim_fde                   = 1
PVT.enable_pvt_kf               = true
PVT.kf_measures_ecef_pos_sd_m   = 5
PVT.kf_measures_ecef_vel_sd_ms  = 0.5
PVT.kf_system_ecef_pos_sd_m     = 0.1
PVT.kf_system_ecef_vel_sd_ms    = 0.001
PVT.output_rate_ms             = 1000
PVT.display_rate_ms            = 1000
PVT.output_enabled             = true
PVT.max_clock_offset_ms        = 1000
PVT.iono_model                 = Broadcast
PVT.trop_model                 = Saastamoinen
PVT.rinex_output_enabled       = false
PVT.rinex_version              = 4
PVT.rinexobs_rate_ms           = 1000
PVT.gpx_output_enabled         = false
PVT.geojson_output_enabled     = false
PVT.kml_output_enabled         = false
PVT.xml_output_enabled         = false
PVT.nmea_output_file_enabled   = false

;######### REMOTE MONITOR/CONTROL CONFIG ############
GNSS-SDR.telecommand_enabled   = true
GNSS-SDR.telecommand_tcp_port  = 3333

PVT.enable_monitor             = true
PVT.monitor_client_addresses   = 127.0.0.1
PVT.monitor_udp_port           = 1111

Monitor.enable_monitor         = true
Monitor.client_addresses       = 127.0.0.1
Monitor.udp_port               = 1112
