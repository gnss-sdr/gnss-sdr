; Reference configuration for the SAPHYRION EVK1029 dual-band RF front-end
; (EVK1029_Signal_Source), tracking Galileo E1+E5a and GPS L1+L5 from one
; dual-IF raw capture.
;
; EVK1029_Signal_Source supports two input modes:
;   - Batch: processes a previously recorded raw capture file
;     (SignalSource0.filename). Used below.
;   - Real time: streams live raw samples from EVK1029_CtrlApp over shared
;     memory (SignalSource0.input = shared_memory / .shm_name), with
;     EVK1029_CtrlApp's "Shared-memory Stream Start" active.
;
; The source can also downconvert/decimate each RF band itself
; (SignalSource0.enable_freq_xlating = true), either on CPU or, if CUDA is
; available, on the GPU (SignalSource0.bandN_cuda = true, as configured
; below) -- the recommended configuration, since GPU offload removes that
; work from the CPU entirely. Either way, SignalConditioner0/1 must be set
; to Bypass (see below), since the source already outputs decimated complex
; baseband samples. The "traditional" gnss-sdr signal conditioner chain is
; still fully supported: set SignalSource0.enable_freq_xlating = false and
; configure a real SignalConditionerN (DataTypeAdapter/InputFilter/Resampler)
; instead.
;
; Edit SignalSource0.filename (or .input/.shm_name for real time) and, if
; you use AGNSS aiding, the GNSS-SDR.AGNSS_* paths below to point at your
; own capture/aiding files before running.

[GNSS-SDR]
;ControlThread.wait_for_flowgraph = false

;######### GLOBAL OPTIONS ##################
GNSS-SDR.num_sources                    = 1
GNSS-SDR.internal_fs_sps                = 22187500; internal working rate after decimation
GNSS-SDR.osnma_enable                   = false
GNSS-SDR.observable_interval_ms         = 1000
GNSS-SDR.assist_dual_frequency_acq      = true

GNSS-SDR.clock_frequency_offset_ppm     =  0.0153
GNSS-SDR.clock_frequency_max_error_ppm  =  0.1; 0.1 ppm oscillator
GNSS-SDR.receiver_max_velocity_m_s      =  28;  100 km/h
GNSS-SDR.doppler_prediction_before_fix  = false

; Runtime satellite-visibility-aware acquisition search: reorders the
; acquisition search queue to favor satellites confidently above the
; horizon once a fix or the AGNSS reference location above is available,
; instead of a plain FIFO order.
GNSS-SDR.enable_visibility_aware_search      = true
; Visible-satellite picks per 1 maybe-visible pick in the search order.
GNSS-SDR.visible_vs_mayvisible_search_ratio  = 10
; Slow-fallback periodic recompute, in receiver-time seconds -- not the main
; trigger, see above.
GNSS-SDR.visibility_recompute_interval_s = 120.0
; Force a recompute once the receiver has moved this far (meters, ECEF)
; since the last one, independent of the interval above.
GNSS-SDR.visibility_recompute_position_threshold_m = 1000.0
; Half-window (seconds) around toa before almanac is treated as stale. Keep
; well under 302400 (half a week) -- toa is seconds-of-week, so ages can't
; be told apart unambiguously beyond that. Ephemeris staleness has no
; equivalent parameter: it's checked against RTKLIB's own per-system
; MAXDTOE/MAXDTOE_GAL/MAXDTOE_BDS constants unconditionally.
GNSS-SDR.visibility_almanac_max_age_s = 259200.0
GNSS-SDR.search_elevation_mask = 10

; Caps how many times per second any single PRN+signal can be handed out for
; a fresh acquisition attempt (0 = disabled/unlimited, prior behavior). With
; few entries in a signal's visible bucket, a satellite that fails
; acquisition immediately can otherwise be re-handed to the next idle
; channel on every ~10 Hz idle tick, and with many idle channels polling
; that adds up to hundreds of repeat attempts per second on the same PRN
; for no benefit. 5 = at most once every 200 ms per PRN+signal.
GNSS-SDR.acquisition_max_retry_rate_hz = 5

; Aiding
GNSS-SDR.AGNSS_XML_enabled       = true
GNSS-SDR.AGNSS_ref_location      = 46.012965,8.907565; Lat, Lon
GNSS-SDR.AGNSS_ref_utc_time      = 10/09/2026 00:00:00.000000; dd/mm/yyyy hh:mm:ss
GNSS-SDR.AGNSS_gal_ephemeris_xml = /path/to/your/gal_fnav_ephemeris.xml
GNSS-SDR.AGNSS_gal_almanac_xml   = /path/to/your/gal_almanac.xml
GNSS-SDR.AGNSS_gal_iono_xml      = /path/to/your/gal_iono.xml
GNSS-SDR.AGNSS_gal_utc_model_xml = /path/to/your/gal_utc_model.xml
GNSS-SDR.AGNSS_gps_ephemeris_xml = /path/to/your/gps_ephemeris.xml
GNSS-SDR.AGNSS_gps_almanac_xml   = /path/to/your/gps_almanac.xml
GNSS-SDR.AGNSS_gps_iono_xml      = /path/to/your/gps_iono.xml
GNSS-SDR.AGNSS_gps_utc_model_xml = /path/to/your/gps_utc_model.xml

;######### SIGNAL_SOURCE CONFIG ############
; Real time processing (uncomment if required). EVK1029_CtrlApp must be
; configured to stream on shared memory.
;SignalSource0.input    = shared_memory
;SignalSource0.shm_name = /evk1029_stream

; Process recorded file (exclusive with real time processing above)
SignalSource0.filename                 = /path/to/your/Record_long.rec

SignalSource0.implementation           = EVK1029_Signal_Source
SignalSource0.sampling_frequency       = 177500000
SignalSource0.RF_channels              = 2
SignalSource0.seconds_to_skip          = 0
SignalSource0.dump                     = false
SignalSource0.dump_filename            = ./evk1029_signal_source.dat

SignalSource0.enable_freq_xlating      = true
; Enable if CUDA is available to accelerate DDC and filtering on GPU
SignalSource0.band0_cuda               = true
SignalSource0.band0_window             = kaiser
SignalSource0.band0_attenuation_dB     = 41.3
SignalSource0.band0_kaiser_beta        = 6.76
SignalSource0.band0_IF                 = -22080000
SignalSource0.band0_bw                 = 10000000
SignalSource0.band0_tw                 = 4000000
SignalSource0.band0_decimation_factor  = 8

SignalSource0.band1_cuda               = true
; Enable if CUDA is available to accelerate DDC and filtering on GPU
SignalSource0.band1_window             = kaiser
SignalSource0.band1_attenuation_dB     = 41.3
SignalSource0.band1_kaiser_beta        = 6.76
SignalSource0.band1_IF                 = -66050000
SignalSource0.band1_bw                 = 10000000
SignalSource0.band1_tw                 = 4000000
SignalSource0.band1_decimation_factor  = 8

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner0.implementation = Bypass
SignalConditioner1.implementation = Bypass

;######### CHANNELS GLOBAL CONFIG ############
; Depending on PC performance this can be reduced down to one if required for real time processing
Channels.in_acquisition = 8

Channels_1B.count = 10; Galileo E1
Channels_5X.count = 10; Galileo E5a
Channels_1C.count = 10; GPS L1
Channels_L5.count = 10; GPS L5

Channels_1B.RF_channel_ID = 0
Channels_1C.RF_channel_ID = 0
Channels_5X.RF_channel_ID = 1
Channels_L5.RF_channel_ID = 1

;######### ACQUISITION GLOBAL CONFIG ############
; Galileo E1-C Pilot channel acquisition primary code 4092 chips/1.023Mcps=4ms; secondary code (25 chip): 25×4ms = 100ms
; Doppler step is 1/2T keeps correlation loss due to frequency error below 4 dBs.
Acquisition_1B.implementation                 = Galileo_E1_PCPS_Ambiguous_Acquisition
Acquisition_1B.full_grid_search               = true
Acquisition_1B.alm_ephe_assisted_doppler_narrowing = true; Almanac/Ephe doppler assistance
Acquisition_1B.acquire_pilot                  = true
Acquisition_1B.item_type                      = gr_complex
Acquisition_1B.coherent_integration_time_ms   = 4
Acquisition_1B.doppler_max                    = 5000
Acquisition_1B.doppler_step                   = 125; * 1/2*T (3.8 dB max loss)
Acquisition_1B.max_dwells                     = 5; 20 ms incoherent accumulation
Acquisition_1B.pfa                            = 1e-7
Acquisition_1B.cboc                           = true
Acquisition_1B.dump                           = false
Acquisition_1B.dump_filename                  = ./acq_galileo_1b.dat

; Galileo E5a-I Data channel acquisition: primary code 10230 chips/10.23Mcps = 1ms; secondary code (20 chip): 20×20ms = 400ms.
Acquisition_5X.implementation                 = Galileo_E5a_Pcps_Acquisition
Acquisition_5X.full_grid_search               = true; when assist_dual_frequency_acq = false
Acquisition_5X.alm_ephe_assisted_doppler_narrowing  = false; Almanac/Ephe doppler assistance when dual_freq_assisted_doppler_narrowing = false
Acquisition_5X.dual_freq_assisted_doppler_narrowing = true
Acquisition_5X.item_type                      = gr_complex
Acquisition_5X.coherent_integration_time_ms   = 1
Acquisition_5X.doppler_max                    = 3740
Acquisition_5X.doppler_step                   = 500; 1/2*T (3.8 dB max loss)
Acquisition_5X.max_dwells                     = 20; 20 ms incoherent accumulation
Acquisition_5X.pfa                            = 1e-7
Acquisition_5X.dump                           = false
Acquisition_5X.dump_filename                  = ./acq_galileo_5x.dat

Acquisition_1C.implementation                 = GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.full_grid_search               = true
Acquisition_1C.alm_ephe_assisted_doppler_narrowing = true; Almanac/Ephe doppler assistance
Acquisition_1C.item_type                      = gr_complex
Acquisition_1C.coherent_integration_time_ms   = 1
Acquisition_1C.doppler_max                    = 5000
Acquisition_1C.doppler_step                   = 500; 1/(2T)
Acquisition_1C.max_dwells                     = 20; 20 ms incoherent accumulation
Acquisition_1C.pfa                            = 1e-8
Acquisition_1C.dump                           = false
Acquisition_1C.dump_filename                  = ./acq_gps_1c.dat

Acquisition_L5.implementation                 = GPS_L5i_PCPS_Acquisition
Acquisition_L5.full_grid_search               = true; when assist_dual_frequency_acq = false
Acquisition_L5.alm_ephe_assisted_doppler_narrowing  = false;  Almanac/Ephe doppler assistance when assist_dual_frequency_acq = false
Acquisition_L5.dual_freq_assisted_doppler_narrowing = true
Acquisition_L5.acquire_pilot                  = true
Acquisition_L5.item_type                      = gr_complex
Acquisition_L5.coherent_integration_time_ms   = 1
Acquisition_L5.doppler_max                    = 3740
Acquisition_L5.doppler_step                   = 500; 1/(2T)
Acquisition_L5.max_dwells                     = 20; 20 ms incoherent accumulation
Acquisition_L5.pfa                            = 1e-8
Acquisition_L5.dump                           = false
Acquisition_L5.dump_filename                  = ./acq_gps_l5.dat

;######### TRACKING GLOBAL CONFIG ############
; FLL frequency discriminator is a wrapped ATAN delta phase discriminator. With T=4 ms has a capture range of 1/4T = 62.5 Hz.
; Galileo E1 acquisition may correlate over bit/second code boundary. In this case power shifts to lateral frequency bins.
; To guarantee that signals are passed from Acquisition to tracking with a frequency error suitable for the frequency discriminator
; (or even worse, compatible with the phase discriminator's capture range) a sequential Doppler scan phase must be performed.
; This reduces the frequency error down to what the FLL/PLL loop can handle.
; FLL tracking threshold: 3-sigma_FLL <= 1/4T
; PLL tracking threshold: 3-sigma_PLL <= 20 deg

Tracking_1B.implementation                     = Galileo_E1_DLL_PLL_VEML_Tracking
Tracking_1B.item_type                          = gr_complex
Tracking_1B.carrier_aiding                     = true
Tracking_1B.fll_bw_hz                          = 10.0; (T=4-ms; the 1-sigma jitter stays below 20-Hz  @ 30-dB-Hz)
Tracking_1B.pll_bw_hz                          = 10.0; (T=4-ms; the 1-sigma jitter stays below 15 deg @ 30 dB-HZ)
Tracking_1B.dll_bw_hz                          = 2.0;  (T=4-ms; typ. well below 1/6th 1-sigma DLL phase jitter at 30 dB-Hz, fast convergence)
Tracking_1B.pll_bw_narrow_hz                   = 5.0;  (T=20-ms; the 1-sigma jitter stays below 15 deg @ 30 dB-HZ; jerk > 10 g/s)
Tracking_1B.dll_bw_narrow_hz                   = 0.5;  (T=20-ms; typ. well below 1/6th 1-sigma DLL phase jitter at 30 dB-Hz)
Tracking_1B.enable_fll_pull_in                 = true
Tracking_1B.enable_fll_steady_state            = false
Tracking_1B.track_pilot                        = true
Tracking_1B.early_late_space_chips             = 0.15
Tracking_1B.very_early_late_space_chips        = 0.6
Tracking_1B.very_early_late_space_narrow_chips = 0.30
Tracking_1B.extend_correlation_symbols         = 5
Tracking_1B.f_error_step_num                   = 9
Tracking_1B.f_error_accumulation               = 5; 20 ms
Tracking_1B.f_error_doppler_step               = 31;62.5; (1/8T)
Tracking_1B.f_error_dump                       = false
Tracking_1B.f_error_dump_filename              = f_error_dump_filename_galileo_1b.csv
Tracking_1B.dump                               = false
Tracking_1B.dump_filename                      = trk_galileo_1b_ch

Tracking_5X.implementation                     = Galileo_E5a_DLL_PLL_Tracking
Tracking_5X.carrier_aiding                     = true
Tracking_5X.item_type                          = gr_complex
Tracking_5X.fll_bw_hz                          = 10.0; (T=1-ms; the 1-sigma jitter stays below 10-Hz  @ 30-dB-Hz)
Tracking_5X.pll_bw_hz                          = 10.0; (T=1-ms; the 1-sigma jitter stays well below 15 deg @ 30 dB-HZ)
Tracking_5X.dll_bw_hz                          = 2.0;  (T=1-ms; typ. well below 1/6th 1-sigma DLL phase jitter at 30 dB-Hz, fast convergence)
Tracking_5X.pll_bw_narrow_hz                   = 5.0;  (T=20-ms; the 1-sigma jitter stays significantly below 15 deg @ 30 dB-HZ; jerk > 10 g/s)
Tracking_5X.dll_bw_narrow_hz                   = 0.5;  (T=20-ms; typ. significantly below 1/6th 1-sigma DLL phase jitter at 30 dB-Hz)
Tracking_5X.enable_fll_pull_in                 = true
Tracking_5X.enable_fll_steady_state            = false
Tracking_5X.extend_correlation_symbols         = 20; extend to 20 ms
Tracking_5X.track_pilot                        = true
Tracking_5X.early_late_space_chips             = 0.2
;not required if Acquisition_5X.enable_doppler_narrowing     = true
;Tracking_5X.f_error_step_num                   = 5
;Tracking_5X.f_error_accumulation               = 20; 20 ms
;Tracking_5X.f_error_doppler_step               = 250; (1/4T)
Tracking_5X.f_error_dump                        = false
Tracking_5X.f_error_dump_filename               = f_error_dump_filename_galileo_x5.csv
Tracking_5X.dump                                = false
Tracking_5X.dump_filename                       = trk_galileo_5x_ch

Tracking_1C.implementation                     = GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type                          = gr_complex
Tracking_1C.carrier_aiding                     = true
Tracking_1C.fll_bw_hz                          = 10.0
Tracking_1C.pll_bw_hz                          = 10.0
Tracking_1C.dll_bw_hz                          = 2.0
Tracking_1C.pll_bw_narrow_hz                   = 5.0
Tracking_1C.dll_bw_narrow_hz                   = 0.5
Tracking_1C.enable_fll_pull_in                 = true
Tracking_1C.enable_fll_steady_state            = false
Tracking_1C.extend_correlation_symbols         = 20
Tracking_1C.f_error_step_num                   = 5
Tracking_1C.f_error_accumulation               = 20; 20 ms
Tracking_1C.f_error_doppler_step               = 250; (1/4T)
Tracking_1C.f_error_dump                       = false
Tracking_1C.f_error_dump_filename              = f_error_dump_filename_gps_1c.csv
Tracking_1C.dump                               = false
Tracking_1C.dump_filename                      = trk_gps_1c_ch

Tracking_L5.implementation                     = GPS_L5_DLL_PLL_Tracking
Tracking_L5.item_type                          = gr_complex
Tracking_L5.carrier_aiding                     = true
;Tracking_L5.secondary_code_statistical_sync   = true
Tracking_L5.fll_bw_hz                          = 10.0
Tracking_L5.pll_bw_hz                          = 10.0
Tracking_L5.dll_bw_hz                          = 2.0
Tracking_L5.pll_bw_narrow_hz                   = 5.0
Tracking_L5.dll_bw_narrow_hz                   = 0.5
Tracking_L5.enable_fll_pull_in                 = true
Tracking_L5.enable_fll_steady_state            = false
Tracking_L5.extend_correlation_symbols         = 20; extend to 20 ms
Tracking_L5.track_pilot                        = true
Tracking_L5.early_late_space_chips             = 0.5
; not required if Acquisition_L5.enable_doppler_narrowing = true
;Tracking_L5.f_error_step_num                   = 9
;Tracking_L5.f_error_accumulation               = 20; 20 ms
;Tracking_L5.f_error_doppler_step               = 250; (1/4T)
Tracking_L5.f_error_dump                       = false
Tracking_L5.f_error_dump_filename              = f_error_dump_filename_gps_l5.csv
Tracking_L5.dump                               = false
Tracking_L5.dump_filename                      = trk_gps_l5_ch

;######### TELEMETRY DECODER CONFIG ############
TelemetryDecoder_1B.implementation = Galileo_E1B_Telemetry_Decoder
TelemetryDecoder_1C.implementation = GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_5X.implementation = Galileo_E5a_Telemetry_Decoder
TelemetryDecoder_L5.implementation = GPS_L5_Telemetry_Decoder

;######### OBSERVABLES CONFIG ############
Observables.implementation = Hybrid_Observables
;Observables.dump          = true

;######### PVT CONFIG ############
PVT.implementation             = RTKLIB_PVT
PVT.elevation_mask             = 10
PVT.dynamics_model             = 0
PVT.raim_fde                   = 1
PVT.enable_pvt_kf              = true
PVT.output_rate_ms             = 1000
PVT.display_rate_ms            = 1000
PVT.output_enabled             = true
PVT.max_clock_offset_ms        = 1000
PVT.gpx_output_enabled         = false
PVT.geojson_output_enabled     = false
PVT.kml_output_enabled         = false
PVT.xml_output_enabled         = true; this enables ephemeris/almanac/iono/utc XML dump
PVT.nmea_output_file_enabled   = false
PVT.rinexobs_rate_ms           = 1000
PVT.iono_model                 = Broadcast; other option: Iono-Free-LC
PVT.trop_model                 = Saastamoinen
PVT.rinex_output_enabled       = false
PVT.rinex_version              = 4
PVT.kf_measures_ecef_pos_sd_m  = 5
PVT.kf_measures_ecef_vel_sd_ms = 0.5
PVT.kf_system_ecef_pos_sd_m    = 0.1
PVT.kf_system_ecef_vel_sd_ms   = 0.001

;######### REMOTE MONITOR/CONTROL CONFIG ############
GNSS-SDR.telecommand_enabled   = true
GNSS-SDR.telecommand_tcp_port  = 3333

PVT.enable_monitor             = true
PVT.monitor_client_addresses   = 127.0.0.1
PVT.monitor_udp_port           = 1111

Monitor.enable_monitor         = true
Monitor.client_addresses       = 127.0.0.1
Monitor.udp_port               = 1112
