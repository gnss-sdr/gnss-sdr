; GNSS-SDR configuration for GPS L1 positioning augmented with SBAS / EGNOS L1
; Reference: EGNOS Open Service Definition Document, Issue 3.0
;
; SPDX-License-Identifier: GPL-3.0-or-later
; SPDX-FileCopyrightText: (C) 2010-2026  (see AUTHORS file for a list of contributors)
;
; The input recording must contain both GPS L1 C/A and an EGNOS L1 signal in
; the same complex-baseband L1 capture. GPS provides the ranging observables;
; the SBAS channel provides corrections and is not used as a ranging source.
;
; This example applies:
;  - fast clock corrections from MT2-5 and MT24;
;  - long-term satellite orbit/clock corrections from MT24 and MT25;
;  - ionospheric grid corrections from MT18 and MT26;
;  - the RTKLIB SBAS tropospheric model.
;
; The resulting solution is for non-safety-critical EGNOS Open Service use.
; Protection levels and a Safety-of-Life solution are not implemented.
;
; ============= Adjust the fields marked with "<--" to your setup ==============

[GNSS-SDR]

;######### GLOBAL OPTIONS ########################################################
GNSS-SDR.internal_fs_sps=2048000  ; <-- sampling frequency after conditioning


;######### SIGNAL SOURCE #########################################################
SignalSource.implementation=File_Signal_Source
SignalSource.filename=/path/to/your_GPS_L1_and_EGNOS_capture.dat  ; <-- capture file
SignalSource.item_type=gr_complex
SignalSource.sampling_frequency=2048000  ; <-- capture sampling frequency
SignalSource.samples=0  ; 0 = process the entire file
SignalSource.repeat=false
SignalSource.enable_throttle_control=false
SignalSource.dump=false


;######### SIGNAL CONDITIONER #####################################################
SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Pass_Through
InputFilter.implementation=Pass_Through
InputFilter.input_item_type=gr_complex
InputFilter.output_item_type=gr_complex
Resampler.implementation=Pass_Through
Resampler.item_type=gr_complex


;######### CHANNELS ##############################################################
; Channel creation follows the signal ordering in the receiver: the eight GPS
; channels are Channel0-Channel7 and the SBAS channel is Channel8.
Channels_1C.count=8
Channels_S1.count=1
Channels.in_acquisition=4


;######### GPS L1 ACQUISITION ####################################################
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.pfa=0.01
Acquisition_1C.doppler_max=5000
Acquisition_1C.doppler_step=250
Acquisition_1C.dump=false
Acquisition_1C.dump_filename=./gps_l1_acquisition.dat


;######### SBAS L1 ACQUISITION ###################################################
; A GEO has little dynamics, but the search range must also cover front-end
; oscillator error. Reduce doppler_max when using a calibrated reference.
Acquisition_S1.implementation=SBAS_L1_PCPS_Acquisition
Acquisition_S1.item_type=gr_complex
Acquisition_S1.pfa=0.01
Acquisition_S1.doppler_max=5000
Acquisition_S1.doppler_step=250
Acquisition_S1.dump=false
Acquisition_S1.dump_filename=./sbas_l1_acquisition.dat


;######### GPS L1 TRACKING #######################################################
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.extend_correlation_symbols=20
Tracking_1C.early_late_space_chips=0.5
Tracking_1C.early_late_space_narrow_chips=0.1
Tracking_1C.pll_bw_hz=35.0
Tracking_1C.dll_bw_hz=2.0
Tracking_1C.pll_bw_narrow_hz=5.0
Tracking_1C.dll_bw_narrow_hz=0.5
Tracking_1C.enable_fll_pull_in=true
Tracking_1C.fll_bw_hz=10.0
Tracking_1C.dump=false
Tracking_1C.dump_filename=./gps_l1_tracking_ch_


;######### SBAS L1 TRACKING ######################################################
; Keep one millisecond per tracking output. The SBAS telemetry decoder performs
; its own rate-1/2 symbol pairing and Viterbi decoding.
Tracking_S1.implementation=SBAS_L1_DLL_PLL_Tracking
Tracking_S1.item_type=gr_complex
Tracking_S1.pll_bw_hz=25.0
Tracking_S1.dll_bw_hz=1.0
Tracking_S1.extend_correlation_symbols=1
Tracking_S1.track_pilot=false
Tracking_S1.dump=false
Tracking_S1.dump_filename=./sbas_l1_tracking_ch_


;######### TELEMETRY DECODERS ####################################################
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_1C.dump=false

; CRC-valid SBAS messages are sent to PVT automatically. The optional dump is
; written to <dump_filename stem>_PRN<nnn>.ems in an EMS-like hexadecimal form.
TelemetryDecoder_S1.implementation=SBAS_L1_Telemetry_Decoder
TelemetryDecoder_S1.dump=true


;######### OBSERVABLES ###########################################################
Observables.implementation=Hybrid_Observables
Observables.dump=false
Observables.dump_filename=./observables.dat


;######### PVT WITH EGNOS CORRECTIONS ############################################
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single

; Apply the satellite fast and long-term orbit/clock corrections. GPS
; satellites without a current valid correction from the selected GEO are not
; admitted to the SBAS solution.
PVT.satellite_ephemeris=SBAS
; With zero, PVT locks to the first SBAS correction stream it receives.
PVT.sbas_satellite=0
; Apply the EGNOS ionospheric grid and the RTKLIB MOPS tropospheric model.
PVT.iono_model=SBAS
PVT.trop_model=SBAS

PVT.elevation_mask=5
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.rinex_version=3
PVT.flag_rtcm_server=false
PVT.flag_rtcm_tty_port=false
PVT.dump=true
PVT.dump_filename=./pvt_egnos.dat
PVT.rinex_output_enabled=true
PVT.nmea_output_file_enabled=false
PVT.kml_output_enabled=true
PVT.gpx_output_enabled=false
PVT.geojson_output_enabled=false
