; GNSS-SDR configuration for SBAS / EGNOS L1 signal reception
; Reference: RTCA DO-229E, Appendix A
;
; SPDX-License-Identifier: GPL-3.0-or-later
; SPDX-FileCopyrightText: (C) 2010-2026  (see AUTHORS file for a list of contributors)
;
; ============================= SBAS / EGNOS notes =============================
;
;  Supported PRN range: 120-138 (RTCA DO-229, Table A-1). Which augmentation
;  service (EGNOS, WAAS, ...) and satellite owns a given PRN changes over time
;  as satellites are reassigned, so no PRN-to-satellite table is kept here;
;  check the current SBAS almanac/status for the PRNs active in your recording.
;
; Signal parameters:
;  - Frequency:     1575.42 MHz (same as GPS L1)
;  - Code rate:     1.023 Mcps, 1023-chip code, 1 ms period
;  - Data rate:     250 bps raw, 500 sps after rate-1/2 FEC (K=7)
;  - Symbol period: 2 ms; coherent integration is limited to 1 code period (1 ms)
;                   because the telemetry decoder performs its own, unsynchronized
;                   sample/symbol pairing and does not tolerate extended tracking
;                   integration straddling a symbol boundary.
;  - Low Doppler:   GEO satellites have < +/-100 Hz Doppler for a static
;                   receiver; the acquisition search range mainly needs to cover
;                   the receiver's reference oscillator offset (1 ppm of
;                   frequency error is ~1.6 kHz at L1), not satellite dynamics.
;  - No pilot:      All SBAS signal power is in the data channel
;  - No ranging:    This SBAS implementation does not produce pseudoranges; SBAS
;                   is used here only to decode and dump L1 NAV messages, not as
;                   a ranging source for the PVT solution.
;
; ============= Adjust the fields marked with "<--" to your setup ==============

[GNSS-SDR]

;######### GLOBAL OPTIONS ########################################################
GNSS-SDR.internal_fs_sps=2048000  ; <-- set to the sampling frequency of your capture


;######### SIGNAL SOURCE #########################################################
SignalSource.implementation=File_Signal_Source
SignalSource.filename=/path/to/yourfile.dat  ; <-- PUT YOUR CAPTURE FILE HERE (complex baseband at 1575.42 MHz)
SignalSource.item_type=gr_complex
SignalSource.sampling_frequency=2048000  ; <-- set to the sampling frequency of your capture
SignalSource.samples=0  ; 0 = process the entire file
SignalSource.repeat=false
SignalSource.dump=false


;######### SIGNAL CONDITIONER #####################################################
SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Pass_Through
InputFilter.implementation=Pass_Through
InputFilter.input_item_type=gr_complex
InputFilter.output_item_type=gr_complex
Resampler.implementation=Pass_Through
Resampler.item_type=gr_complex


;######### CHANNELS ##############################################################
; Signal code "S1" identifies the SBAS L1 channel type.
Channel.signal=S1
Channels_S1.count=3
Channels.in_acquisition=1

; Pre-assigning PRNs (120-138) lets acquisition start on them immediately.
; Remove these lines to let the receiver search the whole SBAS PRN range.
Channel0.satellite=121  ; <-- set to a PRN present in your recording
Channel1.satellite=136  ; <-- set to a PRN present in your recording
Channel2.satellite=123  ; <-- set to a PRN present in your recording


;######### ACQUISITION ###########################################################
; GEO satellites are quasi-stationary (< +/-100 Hz Doppler for a static
; receiver), so doppler_max mainly needs to cover the frequency error of the
; front-end reference oscillator: 1 ppm is ~1.6 kHz at L1. The default below is
; safe for uncalibrated front-ends; with an accurate (e.g., TCXO/OCXO-driven or
; calibrated) reference you can reduce it to 1000 Hz or less to speed up
; acquisition.
Acquisition_S1.implementation=SBAS_L1_PCPS_Acquisition
Acquisition_S1.item_type=gr_complex
Acquisition_S1.pfa=0.01  ; probability of false alarm - adapts to the noise floor
Acquisition_S1.doppler_max=5000  ; [Hz] <-- reduce if your front-end reference is accurate
Acquisition_S1.doppler_step=250  ; [Hz]
Acquisition_S1.dump=false
Acquisition_S1.dump_filename=./sbas_acq_dump.dat


;######### TRACKING ##############################################################
; extend_correlation_symbols is capped to 1 code period (1 ms): the telemetry
; decoder performs its own, unsynchronized sample/symbol pairing and cannot
; tolerate extended coherent integration straddling a symbol boundary.
Tracking_S1.implementation=SBAS_L1_DLL_PLL_Tracking
Tracking_S1.item_type=gr_complex
Tracking_S1.pll_bw_hz=25.0  ; [Hz] - narrow bandwidth for low-dynamics GEO
Tracking_S1.dll_bw_hz=1.0  ; [Hz] - very stable for GEO
Tracking_S1.extend_correlation_symbols=1  ; 1 ms per output; the telemetry decoder handles FEC and bit sync
Tracking_S1.track_pilot=false  ; SBAS has no pilot component
Tracking_S1.dump=false
Tracking_S1.dump_filename=tracking_ch_


;######### TELEMETRY DECODER #####################################################
; The SBAS telemetry decoder implements Viterbi decoding (rate-1/2, K=7),
; CRC-24Q verification, and RTCA DO-229 message framing. With dump=true, the
; decoded messages of each PRN are written in hexadecimal, one line per
; message, to <dump_filename stem>_PRN<nnn>.ems (EMS-like layout).
TelemetryDecoder_S1.implementation=SBAS_L1_Telemetry_Decoder
TelemetryDecoder_S1.dump=true
TelemetryDecoder_S1.dump_filename=./sbas_telemetry.dat


;######### OBSERVABLES ###########################################################
Observables.implementation=Hybrid_Observables
Observables.dump=false
Observables.dump_filename=./observables.dat


;######### PVT ###################################################################
; Note: SBAS is not used as a ranging source. The SBAS telemetry decoder never
; marks its output as valid for pseudorange computation, so an SBAS-only
; configuration produces no observables and no position fixes; this block is
; kept for completeness. In a mixed GPS L1 + SBAS L1 configuration, enable
; satellite and ionospheric corrections with:
;   PVT.satellite_ephemeris=SBAS
;   PVT.iono_model=SBAS
;   PVT.trop_model=SBAS
; If more than one SBAS GEO is tracked, select one correction stream explicitly,
; for example PVT.sbas_satellite=136. The default 0 selects the first received GEO.
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.trop_model=Saastamoinen
PVT.flag_rtcm_server=false
PVT.rinex_version=3
PVT.dump=false
PVT.dump_filename=./pvt.dat
