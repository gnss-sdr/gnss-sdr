; GNSS-SDR configuration for SBAS / EGNOS L1 signal reception
; Reference: RTCA DO-229E, Appendix A
;
; SPDX-License-Identifier: GPL-3.0-or-later
; SPDX-FileCopyrightText: (C) 2010-2026  (see AUTHORS file for a list of contributors)
;
; ============================= SBAS / EGNOS notes =============================
;
;  Supported PRN range: 120-138 (RTCA DO-229, Table A-1). Which augmentation
;  service (EGNOS, WAAS, ...) and satellite owns a given PRN changes over time
;  as satellites are reassigned, so no PRN-to-satellite table is kept here;
;  check the current SBAS almanac/status for the PRNs active in your recording.
;
; Signal parameters:
;  - Frequency:     1575.42 MHz (same as GPS L1)
;  - Code rate:     1.023 Mcps, 1023-chip code, 1 ms period
;  - Data rate:     250 bps raw, 500 sps after rate-1/2 FEC (K=7)
;  - Symbol period: 2 ms; coherent integration is limited to 1 code period (1 ms)
;                   because the telemetry decoder performs its own, unsynchronized
;                   sample/symbol pairing and does not tolerate extended tracking
;                   integration straddling a symbol boundary.
;  - Low Doppler:   GEO satellites have < ±100 Hz Doppler for a static receiver;
;                   doppler_max=1000 is generous, 500 often sufficient
;  - No pilot:      All SBAS signal power is in the data channel
;  - No ranging:    This SBAS implementation does not produce pseudoranges; SBAS
;                   is used here only to decode and dump L1 NAV messages, not as
;                   a ranging source for the PVT solution.
;
; ================== Adjust the fields marked with "<--" ====================

[GNSS-SDR]

;######### GLOBAL OPTIONS ########################################################
GNSS-SDR.internal_fs_sps=2048000  ; matches capture sampling frequency


;######### SIGNAL SOURCE #########################################################
SignalSource.implementation=File_Signal_Source
SignalSource.filename=/home/victoria/SBAS_test/noeleec_maranhosa_SBAS.dat  ; recorded on 1575.42 MHz
SignalSource.item_type=gr_complex
SignalSource.sampling_frequency=2048000
SignalSource.samples=0          ; 0 = process entire file (~389 s)
SignalSource.repeat=false
SignalSource.dump=false


;######### SIGNAL CONDITIONER #####################################################
SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Pass_Through
InputFilter.implementation=Pass_Through
InputFilter.item_type=gr_complex
InputFilter.output_item_type=gr_complex
InputFilter.taps_item_type=float
InputFilter.number_of_taps=5
InputFilter.number_of_bands=2
InputFilter.band1_begin=0.0
InputFilter.band1_end=0.70
InputFilter.band2_begin=0.80
InputFilter.band2_end=1.0
InputFilter.ampl1_begin=1.0
InputFilter.ampl1_end=1.0
InputFilter.ampl2_begin=0.0
InputFilter.ampl2_end=0.0
InputFilter.band1_error=1.0
InputFilter.band2_error=1.0
InputFilter.filter_type=bandpass
InputFilter.grid_density=16
InputFilter.sampling_frequency=2048000
InputFilter.IF=0                ; baseband — captured directly on 1575.42 MHz
Resampler.implementation=Pass_Through;
Resampler.sample_freq_in=2048000
Resampler.sample_freq_out=2048000
Resampler.item_type=gr_complex


;######### CHANNELS ##############################################################
; Signal code "S1" identifies the SBAS L1 channel type.
; Assign the SBAS PRN numbers you want to track (PRN 120–138).
Channel.signal=S1
Channels.in_acquisition=3
Channels_S1.count=3              ; satellites present in this recording

; Pre-assign the PRNs present in this recording so acquisition starts immediately.
Channel0.satellite=121           ; <-- set to a PRN present in your recording
Channel1.satellite=136           ; <-- set to a PRN present in your recording
Channel2.satellite=123           ; <-- set to a PRN present in your recording


;######### ACQUISITION ###########################################################
; GEO satellites are quasi-stationary: valid Doppler range is very narrow.
; A doppler_max of 500–1000 Hz is typically more than sufficient.
; Lower values speed up acquisition significantly.
Acquisition_S1.implementation=SBAS_L1_PCPS_Acquisition
Acquisition_S1.item_type=gr_complex
Acquisition_S1.pfa=0.01          ; probability of false alarm – adapts to noise floor
Acquisition_S1.doppler_max=5000  ; [Hz] – GEO Doppler is < ±100 Hz for static RX
Acquisition_S1.doppler_step=250   ; [Hz] – fine step for GEO low-Doppler satellites
Acquisition_S1.dump=false
Acquisition_S1.dump_filename=/home/victoria/SBAS_test/process/sbas_acquisition


;######### TRACKING ##############################################################
; extend_correlation_symbols is capped to 1 code period (1 ms): the telemetry
; decoder performs its own, unsynchronized sample/symbol pairing and cannot
; tolerate extended coherent integration straddling a symbol boundary.
Tracking_S1.implementation=SBAS_L1_DLL_PLL_Tracking
Tracking_S1.item_type=gr_complex
;Tracking_S1.early_late_space_chips=0.5
Tracking_S1.pll_bw_hz=25.0      ; [Hz] – narrow BW for low-dynamics GEO
Tracking_S1.dll_bw_hz=1        ; [Hz] – very stable for GEO
Tracking_S1.extend_correlation_symbols=1  ; 1ms per output; SBAS telemetry decoder handles FEC/bit-sync
Tracking_S1.track_pilot=false   ; SBAS has no pilot component
Tracking_S1.dump=true
Tracking_S1.dump_filename=/home/victoria/SBAS_test/process/sbas_tracking_ch_


;######### TELEMETRY DECODER #####################################################
; The SBAS telemetry decoder implements Viterbi decoding (rate-1/2, K=7),
; CRC-24Q verification, and RTCA DO-229 message framing.
TelemetryDecoder_S1.implementation=SBAS_L1_Telemetry_Decoder
TelemetryDecoder_S1.dump=true
TelemetryDecoder_S1.dump_filename=/home/victoria/SBAS_test/process/sbas_telemetry.dat


;######### OBSERVABLES ###########################################################
Observables.implementation=Hybrid_Observables
Observables.dump=true
Observables.dump_filename=/home/victoria/SBAS_test/process/sbas_observables.dat


;######### PVT ###################################################################
; Note: SBAS is not used as a ranging source in this configuration. The SBAS
; telemetry decoder never marks its output as valid for pseudorange computation,
; and no SBAS DGPS/integrity corrections are applied to the PVT solution.
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.trop_model=Saastamoinen
PVT.flag_rtcm_server=false
PVT.rinex_version=3
PVT.dump=true
PVT.dump_filename=/home/victoria/SBAS_test/process/sbas_pvt.dat
